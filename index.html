<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Friskis – lediga klasser</title>
<style>
:root{color-scheme:light;--green:#087f45;--ink:#17231c;--muted:#66736b;--line:#e3e9e5;--bg:#f5f8f6}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,Segoe UI,sans-serif}
main{max-width:850px;margin:48px auto;padding:0 18px}.top{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
h1{font-size:clamp(27px,5vw,38px);line-height:1.1;margin:0 0 8px}.sub{color:var(--muted);margin:0}
button{border:0;border-radius:12px;background:var(--green);color:white;font-weight:700;padding:13px 18px;font-size:15px;cursor:pointer}button:disabled{opacity:.6;cursor:wait}
.panel{margin-top:24px;background:white;border:1px solid var(--line);border-radius:18px;padding:20px}
.status{color:var(--muted);font-size:14px}.class{padding:15px 0;border-bottom:1px solid var(--line)}.class:last-child{border:0}
.class h2{font-size:18px;margin:0}.meta{color:var(--muted);font-size:14px}.pill{display:inline-block;background:#e8f6ee;color:#087f45;padding:3px 9px;border-radius:20px;font-size:13px;font-weight:700}
.note{font-size:13px;color:var(--muted);margin-top:18px}
</style>
</head>
<body><main>
<div class="top"><div><h1>Friskis – lediga klasser</h1><p class="sub">Visar träningspass med bokningsbara platser.</p></div><button id="refresh">Uppdatera klasser</button></div>
<section class="panel"><div id="status" class="status">Tryck på Uppdatera klasser för att hämta aktuell information.</div><div id="results"></div></section>
<p class="note">Anläggningar: Uppsala-anläggningarna i urvalet. Listan uppdateras endast när du trycker på knappen.</p>
<script>
const API='https://friskis-api.benny-larsson-23a.workers.dev/classes';
const BUSINESS_UNITS=[6184,6186,6185,6188,6187];
const CUSTOMER_ID='1370766';
const statusEl=document.querySelector('#status'),resultsEl=document.querySelector('#results'),button=document.querySelector('#refresh');
function setStatus(s){statusEl.textContent=s}
function getActivities(payload){
  if(Array.isArray(payload)) return payload;
  for(const key of ['groupActivities','items','data','results']) if(Array.isArray(payload?.[key])) return payload[key];
  return [];
}
function localDateTime(iso){
  return new Intl.DateTimeFormat('sv-SE',{weekday:'short',day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}).format(new Date(iso));
}
function names(items){
  if(!Array.isArray(items)) return '';
  return items.map(x=>typeof x==='string'?x:(x.name||x.fullName||'')).filter(Boolean).join(', ');
}
function render(activities){
  const available=activities.filter(p=>
    BUSINESS_UNITS.includes(Number(p.businessUnit?.id)) &&
    !p.cancelled &&
    Number(p.slots?.leftToBook)>0 &&
    p.duration?.start
  ).sort((a,b)=>new Date(a.duration.start)-new Date(b.duration.start));
  resultsEl.replaceChildren();
  if(!available.length){setStatus('Inga pass med bokningsbara platser hittades i den hämtade perioden.');return}
  for(const pass of available){
    const row=document.createElement('article');row.className='class';
    const title=document.createElement('h2');title.textContent=pass.name||pass.groupActivityProduct?.name||'Träningspass';
    const meta=document.createElement('div');meta.className='meta';
    const details=[localDateTime(pass.duration.start),pass.businessUnit?.name,names(pass.locations),names(pass.instructors)].filter(Boolean);
    meta.textContent=details.join(' · ');
    const count=document.createElement('span');count.className='pill';count.textContent=pass.slots.leftToBook+' lediga platser';
    row.append(title,meta,count);resultsEl.append(row);
  }
  setStatus('Uppdaterad '+new Date().toLocaleString('sv-SE')+' · '+available.length+' pass med lediga platser');
}
async function refresh(){
  button.disabled=true;resultsEl.replaceChildren();setStatus('Hämtar aktuella pass …');
  try{
    const response=await fetch(API,{method:'GET',cache:'no-store'});
    if(!response.ok) {
      let detail='';
      try { const err=await response.json(); detail=err.error||err.message||''; } catch {}
      throw new Error('Worker svarade med HTTP '+response.status+(detail?' – '+detail:''));
    }
    const payload=await response.json();
    const activities=getActivities(payload);
    if(!activities.length) throw new Error('Svaret innehöll ingen lista med pass. Kontrollera Worker-svaret.');
    render(activities);
  }catch(err){
    setStatus('Kunde inte hämta klasser: '+String(err.message||err));
  }finally{button.disabled=false}
}
button.addEventListener('click',refresh);
</script></main></body></html>
