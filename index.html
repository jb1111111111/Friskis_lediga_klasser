<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Friskis – lediga klasser</title>
<style>
:root{color-scheme:light;--green:#087f45;--ink:#17231c;--muted:#66736b;--line:#e3e9e5;--bg:#f5f8f6}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,Segoe UI,sans-serif}
main{max-width:900px;margin:38px auto;padding:0 16px}.top{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
h1{font-size:clamp(27px,5vw,38px);line-height:1.1;margin:0 0 8px}.sub{color:var(--muted);margin:0}
button,select{font:inherit}button{border:0;border-radius:11px;background:var(--green);color:white;font-weight:700;padding:11px 16px;font-size:14px;cursor:pointer}button:disabled{opacity:.6;cursor:wait}
.panel{margin-top:20px;background:white;border:1px solid var(--line);border-radius:18px;padding:18px}
.filters{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-bottom:17px}
.facilities{display:flex;flex-wrap:wrap;gap:9px;margin:0 0 16px}.facility-toggle{display:flex;align-items:center;gap:8px;padding:8px 11px;border:1px solid var(--line);border-radius:11px;background:#f8faf8;font-size:14px;font-weight:600;cursor:pointer}.facility-toggle input{width:17px;height:17px;margin:0;accent-color:var(--green)}.facility-heading{font-size:13px;color:var(--muted);font-weight:700;margin:0 0 8px}
.filter label{display:block;font-size:13px;color:var(--muted);font-weight:700;margin-bottom:5px}
select{width:100%;padding:10px;border:1px solid var(--line);border-radius:10px;background:white;color:var(--ink)}
.days{display:flex;gap:7px;overflow-x:auto;padding:3px 1px 12px;scrollbar-width:thin}
.days button{flex:0 0 auto;background:#edf3ef;color:var(--ink);padding:9px 12px;min-width:67px}
.days button.active{background:var(--green);color:white}
.dayname{display:block;font-size:12px;font-weight:500;opacity:.85}.daynum{display:block;font-size:15px}
.status{color:var(--muted);font-size:14px;margin:5px 0 12px}.class{padding:14px 0;border-bottom:1px solid var(--line)}.class:last-child{border:0}
.classhead{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}.class h2{font-size:17px;margin:0}.meta{color:var(--muted);font-size:13px;margin:3px 0 7px}
.pill{display:inline-block;padding:3px 9px;border-radius:20px;font-size:12px;font-weight:700}
.pill.available{background:#e2f5e9;color:#087f45}
.pill.full{background:#fde7ef;color:#a51d50}
.pill.queue{background:#f1f3f5;color:#46515a;margin-left:6px}
.fav{background:transparent;color:#b17b00;padding:0 4px;font-size:24px;line-height:1;min-width:34px}.fav:hover{background:#fff8df}
.note{font-size:12px;color:var(--muted);margin:16px 2px}
@media(max-width:520px){main{margin:24px auto}.panel{padding:14px}.filters{grid-template-columns:1fr}.top button{width:100%}}
</style>
</head>
<body><main>
<div class="top"><div><h1>Friskis – lediga klasser</h1><p class="sub">Hitta pass och spara dina favoriter.</p></div><button id="refresh">Uppdatera klasser</button></div>
<section class="panel">
  <div class="filters">
    <div class="filter"><label for="availability">Platser</label><select id="availability"><option value="all">Alla pass</option><option value="available">Endast lediga</option></select></div>
    <div class="filter"><label for="passFilter">Pass</label><select id="passFilter"><option value="all">Alla pass</option><option value="favorites">Endast mina favoriter</option></select></div>
  </div>
  <div class="facility-heading">Anläggningar</div>
  <div id="facilities" class="facilities" aria-label="Välj anläggningar"></div>
  <div id="days" class="days" aria-label="Välj dag"></div>
  <div id="status" class="status">Tryck på Uppdatera klasser för att hämta aktuell information.</div>
  <div id="results"></div>
</section>
<p class="note">Dina filter och favoriter sparas automatiskt i den här webbläsaren. Datumvalet börjar alltid på dagens datum. Listan omfattar 14 dagar framåt.</p>
<script>
const API='https://friskis-api.benny-larsson-23a.workers.dev/classes';
const BUSINESS_UNITS=[6184,6186,6185,6188,6187];
const STORAGE_KEY='friskisClassPreferencesV1';
const statusEl=document.querySelector('#status'),resultsEl=document.querySelector('#results'),button=document.querySelector('#refresh');
const availabilityEl=document.querySelector('#availability'),passFilterEl=document.querySelector('#passFilter'),daysEl=document.querySelector('#days'),facilitiesEl=document.querySelector('#facilities');
let activities=[];
let selectedDay=null; // null betyder alla dagar
let preferences={availability:'available',passFilter:'all',favorites:[],businessUnits:[...BUSINESS_UNITS]};
try{const saved=JSON.parse(localStorage.getItem(STORAGE_KEY)||'{}');preferences={...preferences,...saved};if(!Array.isArray(preferences.favorites))preferences.favorites=[];if(!Array.isArray(preferences.businessUnits))preferences.businessUnits=[...BUSINESS_UNITS];preferences.businessUnits=preferences.businessUnits.map(Number).filter(id=>BUSINESS_UNITS.includes(id));}catch{}
availabilityEl.value=preferences.availability;
passFilterEl.value=preferences.passFilter;
function savePreferences(){try{localStorage.setItem(STORAGE_KEY,JSON.stringify(preferences));}catch{}}
function setStatus(s){statusEl.textContent=s}
function renderFacilityFilters(){
  facilitiesEl.replaceChildren();
  const namesById=new Map();
  for(const p of activities){const id=Number(p.businessUnit?.id);if(BUSINESS_UNITS.includes(id)&&p.businessUnit?.name)namesById.set(id,p.businessUnit.name)}
  for(const id of BUSINESS_UNITS){
    const label=document.createElement('label');label.className='facility-toggle';
    const input=document.createElement('input');input.type='checkbox';input.checked=preferences.businessUnits.includes(id);input.addEventListener('change',()=>{preferences.businessUnits=input.checked?[...preferences.businessUnits,id]:preferences.businessUnits.filter(x=>x!==id);savePreferences();render()});
    const text=document.createElement('span');text.textContent=namesById.get(id)||('Anläggning '+id);
    label.append(input,text);facilitiesEl.append(label);
  }
}
function getActivities(payload){if(Array.isArray(payload))return payload;for(const key of ['groupActivities','items','data','results'])if(Array.isArray(payload?.[key]))return payload[key];return []}
function localDateTime(iso){return new Intl.DateTimeFormat('sv-SE',{weekday:'short',day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}).format(new Date(iso))}
function names(items){if(!Array.isArray(items))return '';return items.map(x=>typeof x==='string'?x:(x.name||x.fullName||'')).filter(Boolean).join(', ')}
function passKey(p){return String(p.groupActivityProduct?.id||p.name||p.groupActivityProduct?.name||'').trim().toLocaleLowerCase('sv-SE')}
function waitingListSize(p){
  // inWaitingList är antalet personer i kön enligt BRP-svaret.
  if(p.inWaitingList!==undefined&&p.inWaitingList!==null&&Number.isFinite(Number(p.inWaitingList)))return Math.max(0,Number(p.inWaitingList));
  const countKeys=new Set(['waitinglistsize','waitinglistcount','waitinglistlength','waitlistsize','waitlistcount','waitlistlength','queuecount','queuesize']);
  const seen=new Set();
  function find(value,depth=0){
    if(!value||typeof value!=='object'||depth>5||seen.has(value))return null;
    seen.add(value);
    if(Array.isArray(value))return null;
    for(const [key,v] of Object.entries(value)){
      const normalized=key.toLowerCase().replace(/[_-]/g,'');
      if(countKeys.has(normalized)&&v!==null&&v!==''&&Number.isFinite(Number(v)))return Math.max(0,Number(v));
      if((normalized==='waitinglist'||normalized==='waitlist')&&Array.isArray(v))return v.length;
      if(v&&typeof v==='object'){const found=find(v,depth+1);if(found!==null)return found;}
    }
    return null;
  }
  return find(p);
}
function dayKey(date){return date.getFullYear()+'-'+String(date.getMonth()+1).padStart(2,'0')+'-'+String(date.getDate()).padStart(2,'0')}
function makeDays(){
  daysEl.replaceChildren();
  const allButton=document.createElement('button');
  allButton.type='button';
  allButton.className=selectedDay===null?'active':'';
  allButton.textContent='Alla dagar';
  allButton.setAttribute('aria-pressed',String(selectedDay===null));
  allButton.addEventListener('click',()=>{selectedDay=null;makeDays();render()});
  daysEl.append(allButton);
  for(let i=0;i<14;i++){
    const d=new Date();d.setHours(0,0,0,0);d.setDate(d.getDate()+i);
    const b=document.createElement('button');b.type='button';b.className=i===selectedDay?'active':'';
    const weekday=document.createElement('span');weekday.className='dayname';weekday.textContent=i===0?'Idag':new Intl.DateTimeFormat('sv-SE',{weekday:'short'}).format(d);
    const date=document.createElement('span');date.className='daynum';date.textContent=new Intl.DateTimeFormat('sv-SE',{day:'numeric',month:'short'}).format(d);
    b.append(weekday,date);b.setAttribute('aria-pressed',String(i===selectedDay));b.addEventListener('click',()=>{selectedDay=i;makeDays();render()});daysEl.append(b);
  }
}
function toggleFavorite(pass){
  const key=passKey(pass);if(!key)return;
  preferences.favorites=preferences.favorites.includes(key)?preferences.favorites.filter(x=>x!==key):[...preferences.favorites,key];
  savePreferences();render();
}
function render(){
  const chosenDate=new Date();chosenDate.setHours(0,0,0,0);
  if(selectedDay!==null)chosenDate.setDate(chosenDate.getDate()+selectedDay);
  let filtered=activities.filter(p=>preferences.businessUnits.includes(Number(p.businessUnit?.id))&&!p.cancelled&&p.duration?.start);
  if(preferences.availability==='available')filtered=filtered.filter(p=>Number(p.slots?.leftToBook)>0);
  if(selectedDay!==null){
    const chosenKey=dayKey(chosenDate);
    filtered=filtered.filter(p=>dayKey(new Date(p.duration.start))===chosenKey);
  }
  if(preferences.passFilter==='favorites')filtered=filtered.filter(p=>preferences.favorites.includes(passKey(p)));
  filtered.sort((a,b)=>new Date(a.duration.start)-new Date(b.duration.start));
  resultsEl.replaceChildren();
  if(!filtered.length){setStatus(selectedDay===null?'Inga pass matchar dina filter i den valda perioden.':'Inga pass matchar dina filter för den här dagen.');return}
  for(const pass of filtered){
    const row=document.createElement('article');row.className='class';
    const head=document.createElement('div');head.className='classhead';
    const title=document.createElement('h2');title.textContent=pass.name||pass.groupActivityProduct?.name||'Träningspass';
    const key=passKey(pass),isFav=preferences.favorites.includes(key);
    const star=document.createElement('button');star.type='button';star.className='fav';star.textContent=isFav?'★':'☆';star.title=isFav?'Ta bort favorit':'Spara som favorit';star.setAttribute('aria-label',star.title);star.addEventListener('click',()=>toggleFavorite(pass));
    head.append(title,star);
    const meta=document.createElement('div');meta.className='meta';
    meta.textContent=[localDateTime(pass.duration.start),pass.businessUnit?.name,names(pass.locations),names(pass.instructors)].filter(Boolean).join(' · ');
    row.append(head,meta);
    const spots=Number(pass.slots?.leftToBook)||0;
    const total=Number(pass.slots?.total);
    const hasTotal=Number.isFinite(total)&&total>=0;
    if(hasTotal){
      const totalLabel=document.createElement('span');
      totalLabel.className='pill queue';
      totalLabel.textContent='Totalt: '+total;
      row.append(totalLabel);
    }
    const count=document.createElement('span');
    count.className='pill '+(spots>0?'available':'full');
    count.textContent='Lediga: '+spots;
    row.append(count);
    const queue=waitingListSize(pass);
    const queueLabel=document.createElement('span');
    queueLabel.className='pill queue';
    queueLabel.textContent='På kö: '+(queue===null?'–':queue);
    row.append(queueLabel);
    resultsEl.append(row);
  }
  setStatus(selectedDay===null
    ? filtered.length+' pass visas · Alla dagar (14 dagar framåt)'
    : filtered.length+' pass visas · '+new Intl.DateTimeFormat('sv-SE',{dateStyle:'full'}).format(chosenDate));
}
availabilityEl.addEventListener('change',()=>{preferences.availability=availabilityEl.value;savePreferences();render()});
passFilterEl.addEventListener('change',()=>{preferences.passFilter=passFilterEl.value;savePreferences();render()});
async function refresh(){
  button.disabled=true;setStatus('Hämtar aktuella pass …');
  try{
    const response=await fetch(API,{method:'GET',cache:'no-store'});
    if(!response.ok){let detail='';try{const err=await response.json();detail=err.error||err.message||''}catch{}throw new Error('Worker svarade med HTTP '+response.status+(detail?' – '+detail:''))}
    const payload=await response.json();activities=getActivities(payload);
    if(!activities.length)throw new Error('Svaret innehöll ingen lista med pass. Kontrollera Worker-svaret.');
    renderFacilityFilters();render();
  }catch(err){setStatus('Kunde inte hämta klasser: '+String(err.message||err))}
  finally{button.disabled=false}
}
button.addEventListener('click',refresh);
renderFacilityFilters();
makeDays();
</script></main></body></html>
